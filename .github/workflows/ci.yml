name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test
        run: pytest

  offline-demo:
    name: Offline replay demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run bundled case
        run: openmacrostate demo cases/2023-banks --reveal reveals/2023-banks --evaluation-at 2023-03-13T22:00:00Z --output build/demo
      - name: Replay the SOFR connector fixture offline
        run: |
          openmacrostate connector capture frbny-sofr \
            --start 2023-03-22 --end 2023-03-22 \
            --recording tests/fixtures/connectors/frbny_sofr/recording.json \
            --output build/frbny-sofr
          openmacrostate validate build/frbny-sofr
      - name: Replay the Treasury connector fixture offline
        run: |
          openmacrostate connector capture treasury-debt-to-penny \
            --start 2026-08-05 --end 2026-08-06 \
            --recording tests/fixtures/connectors/treasury_debt_to_penny/recording.json \
            --output build/treasury-debt-to-penny
          openmacrostate validate build/treasury-debt-to-penny
      - name: Upload replay artifacts
        uses: actions/upload-artifact@v4
        with:
          name: offline-replay-artifacts
          path: |
            build/demo
            build/frbny-sofr
            build/treasury-debt-to-penny
          if-no-files-found: error
