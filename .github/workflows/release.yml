name: Release checks

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e '.[dev]'
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test
        run: pytest
      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import os
          from openmacrostate import __version__

          actual = os.environ["GITHUB_REF_NAME"]
          expected = f"v{__version__}"
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} must equal {expected!r}")
          PY
      - name: Verify offline demo
        run: openmacrostate demo cases/2023-banks --reveal reveals/2023-banks --evaluation-at 2023-03-13T22:00:00Z --output build/demo
      - name: Verify offline SOFR connector replay
        run: |
          openmacrostate connector capture frbny-sofr \
            --start 2023-03-22 --end 2023-03-22 \
            --recording tests/fixtures/connectors/frbny_sofr/recording.json \
            --output build/frbny-sofr
          openmacrostate validate build/frbny-sofr
      - name: Verify offline Treasury connector replay
        run: |
          openmacrostate connector capture treasury-debt-to-penny \
            --start 2026-08-05 --end 2026-08-06 \
            --recording tests/fixtures/connectors/treasury_debt_to_penny/recording.json \
            --output build/treasury-debt-to-penny
          openmacrostate validate build/treasury-debt-to-penny
      - name: Verify offline H.4.1 connector replay
        run: |
          openmacrostate connector capture fed-h41-release \
            --start 2023-03-16 --end 2023-03-16 \
            --recording tests/fixtures/connectors/fed_h41_release/recording.json \
            --output build/fed-h41-release
          openmacrostate validate build/fed-h41-release
          openmacrostate audit accounting build/fed-h41-release \
            --rule fed-h41-balance-sheet-v1 \
            --observed-at 2023-03-15T00:00:00Z \
            --json
      - name: Build distributions
        run: python -m build
      - name: Smoke-test the built wheel outside the checkout
        run: |
          python -m venv build/wheel-smoke
          build/wheel-smoke/bin/python -m pip install dist/*.whl
          pushd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/build/wheel-smoke/bin/openmacrostate" example 2023-banks --output wheel-demo
          "$GITHUB_WORKSPACE/build/wheel-smoke/bin/openmacrostate" connector capture --help
          "$GITHUB_WORKSPACE/build/wheel-smoke/bin/openmacrostate" connector capture frbny-sofr \
            --start 2023-03-22 --end 2023-03-22 \
            --recording "$GITHUB_WORKSPACE/tests/fixtures/connectors/frbny_sofr/recording.json" \
            --output wheel-sofr
          "$GITHUB_WORKSPACE/build/wheel-smoke/bin/openmacrostate" validate wheel-sofr
          "$GITHUB_WORKSPACE/build/wheel-smoke/bin/openmacrostate" connector capture treasury-debt-to-penny \
            --start 2026-08-05 --end 2026-08-06 \
            --recording "$GITHUB_WORKSPACE/tests/fixtures/connectors/treasury_debt_to_penny/recording.json" \
            --output wheel-treasury
          "$GITHUB_WORKSPACE/build/wheel-smoke/bin/openmacrostate" validate wheel-treasury
          "$GITHUB_WORKSPACE/build/wheel-smoke/bin/openmacrostate" connector capture fed-h41-release \
            --start 2023-03-16 --end 2023-03-16 \
            --recording "$GITHUB_WORKSPACE/tests/fixtures/connectors/fed_h41_release/recording.json" \
            --output wheel-h41
          "$GITHUB_WORKSPACE/build/wheel-smoke/bin/openmacrostate" validate wheel-h41
          "$GITHUB_WORKSPACE/build/wheel-smoke/bin/openmacrostate" audit accounting wheel-h41 \
            --rule fed-h41-balance-sheet-v1 \
            --observed-at 2023-03-15T00:00:00Z \
            --json
          test -f wheel-demo/snapshot.json
          test -f wheel-demo/scores.json
          test -f wheel-sofr/collection.json
          test -f wheel-treasury/collection.json
          test -f wheel-h41/collection.json
          popd
      - name: Verify source distribution contents
        run: |
          tar -tzf dist/openmacrostate-*.tar.gz | grep '/schemas/v1/reveal.schema.json'
          tar -tzf dist/openmacrostate-*.tar.gz | grep '/schemas/v1/collection.schema.json'
          tar -tzf dist/openmacrostate-*.tar.gz | grep '/cases/2023-banks/case.json'
          tar -tzf dist/openmacrostate-*.tar.gz | grep '/reveals/2023-banks/reveal.json'
          tar -tzf dist/openmacrostate-*.tar.gz | grep '/tests/fixtures/connectors/frbny_sofr/recording.json'
          tar -tzf dist/openmacrostate-*.tar.gz | grep '/tests/fixtures/connectors/treasury_debt_to_penny/recording.json'
          tar -tzf dist/openmacrostate-*.tar.gz | grep '/tests/fixtures/connectors/fed_h41_release/recording.json'
          tar -tzf dist/openmacrostate-*.tar.gz | grep '/tests/fixtures/connectors/fed_h41_release/response.html'
      - name: Upload candidate distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error

# Publishing is intentionally separate. A human Release Manager must verify the
# artifacts and follow docs/releasing.md before creating a GitHub or PyPI release.
